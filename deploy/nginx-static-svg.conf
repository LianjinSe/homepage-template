# Optional: copy this location into the site's existing Nginx server block.
# Content-hashed SVG names can be cached without serving stale wallpaper.
location ^~ /assets/coast-static- {
    try_files $uri =404;
    gzip on;
    gzip_types image/svg+xml;
    gzip_comp_level 6;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
